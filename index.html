<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>一人飲みクエスト｜旅立ちの時</title><style>*{box-sizing:border-box}body{margin:0;background:#080b14;color:#f6eddc;font-family:system-ui,sans-serif}main{max-width:520px;min-height:100svh;margin:auto;padding:24px;display:flex;flex-direction:column;background:radial-gradient(ellipse at 50% 25%,#29263b,#090b14 75%)}header{display:flex;justify-content:space-between;color:#e7c488;font-size:11px;letter-spacing:.12em}#stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:17px;animation:fade .4s}#art{height:35svh;max-height:320px;width:100%;border-radius:18px;border:1px solid #c7a66a66;background:linear-gradient(#171a30,#3b3040 60%,#10131c);display:grid;place-items:center;position:relative;overflow:hidden;box-shadow:0 15px 55px #0009}#art:before{content:"";position:absolute;width:95px;height:95px;border-radius:50%;top:13%;left:calc(50% - 47px);background:#ebd8b2;box-shadow:0 0 65px #f2dcb077}#art span{position:relative;font-size:clamp(80px,20vw,130px);filter:drop-shadow(0 15px 15px #000b)}h1{font-family:serif;font-size:clamp(27px,7vw,40px);margin:0;color:#fff2dc}p{white-space:pre-line;line-height:2;font-size:15px;color:#e0dbe2;min-height:110px;margin:0}.tag{font-size:11px;letter-spacing:.25em;color:#e8c58b}.quest{border:1px solid #cfa96966;background:#141b29;padding:14px;border-radius:12px;width:100%;text-align:left;font-size:13px}.buttons{display:grid;gap:10px}button{padding:17px;border-radius:12px;border:1px solid #e6c385;background:linear-gradient(135deg,#f4d7a0,#b8894b);color:#261a11;font-size:16px;font-weight:800}button.alt{background:#ffffff0b;color:#e9d4b5}.progress{height:3px;background:#ffffff22;border-radius:3px;margin-bottom:12px}.progress div{height:100%;background:#e7c488;transition:width .3s}@keyframes fade{from{opacity:.3;transform:translateY(8px)}to{opacity:1;transform:none}}</style><main><header><span>HITORINOMI QUEST</span><span id="chapter">PROLOGUE</span></header><section id="stage"><div class="tag" id="tag"></div><div id="art"><span id="emoji"></span></div><h1 id="title"></h1><p id="story"></p><div id="quest" class="quest" hidden>🗺️ 酒場をひとつ見つけよう<br>達成報酬：勇気 +10 XP</div></section><footer><div class="progress"><div id="progress"></div></div><div class="buttons"><button id="next"></button><button id="restart" class="alt">最初から見る</button></div></footer></main><script>const slides=[["THE BEGINNING","孤独。","それは、静かに人の心へ忍び寄る。\n姿なき魔物。","🚶","物語を始める"],["THE DARK LORD","魔王、その名は孤独。","人々を絶望の淵へ誘う、\n恐るべき存在。\n\nだが、魔王は無敵ではない。","👹","魔王に立ち向かう"],["THE HERO","勇者は、あなただ。","選ばれし血筋も、特別な才能もいらない。\n誰もが勇者になれる。\n\n必要なのは、ほんの小さな一歩。","⚔️","勇者になる"],["LEGENDARY WEAPON","伝説の武器を手に入れた！","その名も……\n\nスマートフォン。\n\nそう。たぶん今、手に持っているそれだ。","📱","武器を装備する"],["THE PROPHECY","検索せよ。","「一人飲み　やり方」\n\n検索結果の向こうに、\n新たな冒険への扉が現れる。","🔎","光の先へ進む"],["CHAPTER I","第一章｜旅立ちの時","夜の街には、まだ知らない世界がある。\n\n怖ければ、店の前まででもいい。\n今夜、あなたの物語が始まる。","🌃","最初のクエストへ"],["QUEST 01","最初の一歩","今夜の任務は、酒を飲むことではない。\n\n気になる酒場をひとつ見つけること。","🏮","クエストを確認する"],["QUEST COMPLETE","旅立ちの準備、完了。","勇者よ、焦る必要はない。\n店を探すだけでも、立派な冒険だ。\n\n魔王との戦いは、ここから始まる。","🏆","もう一度冒険する"]];let i=0;function render(){const s=slides[i];document.getElementById("tag").textContent=s[0];document.getElementById("title").textContent=s[1];document.getElementById("story").textContent=s[2];document.getElementById("emoji").textContent=s[3];document.getElementById("next").textContent=s[4];document.getElementById("chapter").textContent=i<5?"PROLOGUE":"CHAPTER 01";document.getElementById("progress").style.width=(i+1)/slides.length*100+"%";document.getElementById("quest").hidden=i!==6;document.getElementById("restart").hidden=i===0}document.getElementById("next").onclick=()=>{i=(i+1)%slides.length;render()};document.getElementById("restart").onclick=()=>{i=0;render()};render()</script></html>
